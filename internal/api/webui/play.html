<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WallLoop 播放器</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  body.hidecursor { cursor: none; }
  .layer { position: fixed; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
  .layer.show { opacity: 1; }
  .layer video, .layer img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .layer img { animation: kb 60s ease-in-out infinite alternate; }
  @keyframes kb {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.09) translate(-1.5%, -1.2%); }
  }
  .hud {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-radius: 12px;
    background: rgba(10, 12, 26, .55); backdrop-filter: blur(8px);
    color: #e8ebff; font-size: 13px;
    transition: opacity .8s; border: 1px solid rgba(124, 108, 255, .35);
  }
  .hud.hide { opacity: 0; }
  .hud img { width: 20px; height: 20px; }
  .hud .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fe0c8; box-shadow: 0 0 8px #3fe0c8; }
  .hud a { color: #3fe0c8; text-decoration: none; font-size: 12px; }
  .idle {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: #9aa3cf; text-align: center; padding: 20px;
  }
  .idle img { width: 88px; opacity: .85; }
  .idle .h { color: #e8ebff; font-size: 17px; font-weight: 600; }
  .idle .s { font-size: 13px; color: #646d9e; line-height: 1.8; }
  .idle a { color: #3fe0c8; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="layer" id="la"></div>
  <div class="layer" id="lb"></div>
  <div class="idle hidden" id="idle">
    <img src="logo.svg" alt="">
    <div class="h" id="idle-title">壁纸库为空</div>
    <div class="s" id="idle-sub">前往管理面板上传壁纸,或用 ffmpeg 演示生成器造一段<br>双击屏幕可切换全屏</div>
    <a id="idle-link" href="./">打开管理面板 →</a>
  </div>
  <div class="hud" id="hud">
    <img src="logo.svg" alt="">
    <span class="dot"></span>
    <span id="hud-name">WallLoop</span>
    <a id="hud-panel" href="./">面板</a>
  </div>
<script src="play.js"></script>
</body>
</html>
